    <main>
      <div class="pildora">
        <div class="pildora__foto"><img src="../assets/contacto.jpg" alt="Una librera sonriente conversa con un cliente mientras le muestra un libro en el mesón de la librería" width="1774" height="887"></div>
        <div class="burbuja">
          <h1>Hablemos.</h1>
          <p>Cuéntanos cómo trabajas hoy y qué te gustaría ordenar.</p>
        </div>
      </div>
      <div class="whatsapp">
        <p>La forma más rápida de hablar con nosotros:</p>
        <a class="btn btn--naranja btn--lg" href="https://wa.me/56978704682" target="_blank" rel="noopener"><span>Escríbenos por WhatsApp</span><span class="btn__dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 19z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-1 .8a4 4 0 0 1-1.8-1.8l.8-1-1-2z"/></svg></span></a>
      </div>
      <p class="separador">o déjanos un mensaje</p>
      <form class="form" id="form-contacto" action="mailto:somosrelea@gmail.com" method="post" enctype="text/plain">
        <div class="form__fila">
          <div><label for="c-nombre">Nombre</label><input id="c-nombre" name="nombre" type="text" placeholder="Tu nombre" autocomplete="name" required></div>
          <div><label for="c-correo">Correo</label><input id="c-correo" name="correo" type="email" placeholder="tu@correo.cl" autocomplete="email" required></div>
        </div>
        <div><label for="c-libreria">Tu librería</label><input id="c-libreria" name="libreria" type="text" placeholder="Nombre de tu librería" autocomplete="organization"></div>
        <div><label for="c-mensaje">Mensaje</label><textarea id="c-mensaje" name="mensaje" rows="4" placeholder="Cuéntanos qué necesitas" required></textarea></div>
        <div class="form__enviar"><button type="submit" class="btn"><span>Enviar mensaje</span><span class="btn__dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
      </form>

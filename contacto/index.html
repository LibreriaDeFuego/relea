  <div class="wrap">
    <nav class="nav" aria-label="Principal">
        <a class="nav__logo" href="../"><img src="../assets/logo.svg" alt="RELEA, volver al inicio" width="88" height="22"></a>
        <div class="nav__links" id="menu"><a href="../nosotros/">Nosotros</a><a href="../precios/">Precios</a><a href="../contacto/" aria-current="page">Contacto</a><a href="../preguntas-frecuentes/">Preguntas frecuentes</a></div>

        </div>
      </nav>
    <main>
      <div class="pildora">
        <div class="pildora__foto"><img src="../assets/contacto-fachada.jpg" alt="Fachada de Librería de Fuego, en Pedro Montt 235, Frutillar" width="1104" height="828"></div>
        <div class="burbuja">
          <h1>Hablemos.</h1>
          <p>Cuéntanos cómo trabajas hoy y qué te gustaría ordenar.</p>
        </div>
      </div>
      <form class="form" id="form-contacto" action="mailto:relea@gmail.com" method="post" enctype="text/plain">
        <div class="form__fila">
          <div><label for="c-nombre">Nombre</label><input id="c-nombre" name="nombre" type="text" placeholder="Tu nombre" autocomplete="name" required></div>
          <div><label for="c-correo">Correo</label><input id="c-correo" name="correo" type="email" placeholder="tu@correo.cl" autocomplete="email" required></div>
        </div>
        <div><label for="c-libreria">Tu librería</label><input id="c-libreria" name="libreria" type="text" placeholder="Nombre de tu librería" autocomplete="organization"></div>
        <div><label for="c-mensaje">Mensaje</label><textarea id="c-mensaje" name="mensaje" rows="4" placeholder="Cuéntanos qué necesitas" required></textarea></div>
        <div><button type="submit" class="btn"><span>Enviar mensaje</span><span class="btn__dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button></div>
      </form>
      <div class="chips">
        <a class="chip" href="mailto:relea@gmail.com"><small>Correo</small><span>relea@gmail.com</span></a>
        <a class="chip" href="https://wa.me/56978704682" target="_blank" rel="noopener"><small>WhatsApp</small><span>+56978704682</span></a>
        <a class="chip" href="https://www.instagram.com/relea.app" target="_blank" rel="noopener"><small>Instagram</small><span>@relea.app</span></a>
